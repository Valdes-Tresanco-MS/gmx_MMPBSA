name: gmxMMPBSA
channels:
  - conda-forge
dependencies:
  - python>=3.11,<3.13
  - pip
  # Compatibility smoke tests passed with conda-forge AmberTools 24.8, 25.3,
  # and 26.0, and GROMACS 2022.4, 2023.4, 2024.5, 2025.4, and 2026.0
  # on Python 3.12.
  # Keep these as bounded series ranges instead of exact pins so conda can pick
  # compatible builds across platforms while avoiding untested next-major jumps.
  - numpy>=1.26.4,<2
  - ambertools>=24.8,<27
  - mpi4py>=4.0.1,<5
  - matplotlib>=3.8,<4
  - scipy>=1.14.1,<2
  - parmed<5


  - pandas>=2.2,<3
  - seaborn>=0.13,<0.14
  - tqdm
  - rich>=13,<15

  - git
  - gromacs>=2022,<2027
  - pyqt6
    
